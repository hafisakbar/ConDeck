appId: com.condeck.app
productName: StreamKey
copyright: Copyright © 2026 StreamKey

# Output lands in <repo>/release (gitignored). The Windows build is produced by
# `pnpm dist:win` locally or by .github/workflows/release.yml on windows-latest.
directories:
  output: ../../release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

# The mobile PWA is served from process.resourcesPath/mobile in packaged builds.
extraResources:
  - from: ../mobile/dist
    to: mobile

asar: true
compression: maximum

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: StreamKey-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: StreamKey
  uninstallDisplayName: StreamKey ${version}
  deleteAppDataOnUninstall: false

npmRebuild: true
